<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100713">
<title>A Rose in 34 Languages</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at center, #351027, #100713 75%);
    color: white;
    font-family: Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    overflow-x: hidden;
    text-align: center;
  }

  h1 {
    color: #ff9dbf;
    font-size: clamp(23px, 5vw, 36px);
    margin: 24px 12px 4px;
    text-shadow: 0 0 18px #ff277c;
  }

  p {
    color: #e8c3d4;
    font-size: 14px;
    margin: 6px 12px;
  }

  canvas {
    display: block;
    width: min(94vw, 620px);
    height: min(76vh, 620px);
    min-height: 330px;
    max-height: 620px;
  }

  button {
    background: #a71954;
    color: white;
    border: 1px solid #ff8db9;
    padding: 11px 24px;
    margin: 8px 0 26px;
    border-radius: 30px;
    font-size: 15px;
    cursor: pointer;
  }

  button:active { transform: scale(.97); }

  footer {
    color: #bda0b0;
    font-size: 12px;
    margin: 0 12px 18px;
  }

  @media (prefers-reduced-motion: reduce) {
    canvas { animation: none; }
  }
</style>
</head>

<body>
  <h1>For You, With Love 🌹</h1>
  <p>A little rose made of love in 34 languages</p>

  <canvas id="rose" aria-label="Animated rose formed from words of love">
    A rose made from words in many languages.
  </canvas>

  <button id="replay" type="button">Grow the rose again ✨</button>
  <footer>Made with love · No external resources required</footer>

<script>
"use strict";

const canvas = document.getElementById("rose");
const ctx = canvas.getContext("2d");
const replay = document.getElementById("replay");

const words = [
  "I love you", "Love", "Te amo", "Je t’aime",
  "Ich liebe dich", "Ti amo", "愛してる", "사랑해",
  "मैं तुमसे प्यार करता हूँ", "मैं तुमसे प्यार करती हूँ",
  "أحبك", "Я тебя люблю", "Eu te amo", "Ik hou van jou",
  "Kocham cię", "Seni seviyorum", "Σ' αγαπώ", "Te quiero",
  "Mahal kita", "Anh yêu em", "ฉันรักคุณ", "Nakupenda",
  "Saya cinta kamu", "Jag älskar dig", "Jeg elsker deg",
  "Minä rakastan sinua", "Jeg elsker dig", "Ljubim te",
  "Volim te", "Aloha au iā ʻoe", "Ngo oi nei",
  "Mwen renmen ou", "Mi amas vin", "愛してるよ"
];

let width = 0;
let height = 0;
let points = [];
let startTime = 0;
let frameId = 0;

function resize() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  width = rect.width;
  height = rect.height;
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  createRose();
  startTime = performance.now();
}

function insideEllipse(x, y, cx, cy, rx, ry) {
  return ((x - cx) / rx) ** 2 +
         ((y - cy) / ry) ** 2 <= 1;
}

function inPetals(x, y, cx, cy, scale) {
  const petals = [
    [0, -0.22, 0.20, 0.25],
    [-0.19, -0.13, 0.22, 0.25],
    [0.19, -0.13, 0.22, 0.25],
    [-0.27, 0.04, 0.21, 0.25],
    [0.27, 0.04, 0.21, 0.25],
    [-0.14, 0.14, 0.25, 0.23],
    [0.14, 0.14, 0.25, 0.23],
    [0, 0.12, 0.28, 0.27]
  ];

  return petals.some(([px, py, rx, ry]) =>
    insideEllipse(
      x, y,
      cx + px * scale,
      cy + py * scale,
      rx * scale,
      ry * scale
    )
  );
}

function createRose() {
  points = [];

  const cx = width / 2;
  const scale = Math.min(width * 0.90, height * 1.05, 540);
  const cy = height * 0.40;
  const count = Math.max(220, Math.floor(scale * 1.35));

  // Sample points inside overlapping petal shapes.
  let attempts = 0;

  while (points.length < count && attempts < count * 15) {
    attempts++;

    const x = cx + (Math.random() - 0.5) * scale * 0.95;
    const y = cy + (Math.random() - 0.5) * scale * 0.75;

    if (inPetals(x, y, cx, cy, scale)) {
      points.push({
        x, y,
        word: words[Math.floor(Math.random() * words.length)],
        delay: Math.random() * 1800,
        hue: 330 + Math.random() * 35,
        size: 8 + Math.random() * 3.5,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  // Stem and two leaves.
  const stemTop = cy + scale * 0.30;
  const stemBottom = Math.min(height * 0.96, stemTop + scale * 0.42);

  for (let i = 0; i < 24; i++) {
    const t = i / 23;
    points.push({
      x: cx + Math.sin(t * 2) * scale * 0.035,
      y: stemTop + (stemBottom - stemTop) * t,
      word: ["Love", "Amor", "Liebe", "愛", "प्यार"][i % 5],
      delay: 700 + i * 20,
      hue: 115 + Math.random() * 30,
      size: 9,
      phase: Math.random() * Math.PI * 2,
      stem: true
    });
  }

  for (let side of [-1, 1]) {
    for (let i = 0; i < 9; i++) {
      const t = i / 8;

      points.push({
        x: cx + side * scale * (0.04 + t * 0.24),
        y: stemTop + scale * (0.16 + t * 0.09),
        word: words[(i + (side === 1 ? 10 : 20)) % words.length],
        delay: 1000 + i * 35,
        hue: 112 + Math.random() * 25,
        size: 8.5,
        phase: Math.random() * Math.PI * 2,
        leaf: true,
        side
      });
    }
  }
}

function draw(now) {
  ctx.clearRect(0, 0, width, height);

  const elapsed = now - startTime;
  const cx = width / 2;
  const scale = Math.min(width * 0.90, height * 1.05, 540);
  const cy = height * 0.40;

  // Soft glow behind the rose.
  const glow = ctx.createRadialGradient(
    cx, cy, 4, cx, cy, scale * 0.52
  );

  glow.addColorStop(0, "rgba(255, 30, 120, 0.13)");
  glow.addColorStop(1, "rgba(255, 30, 120, 0)");

  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, width, height);

  for (const p of points) {
    const progress = Math.max(
      0, Math.min(1, (elapsed - p.delay) / 1100)
    );

    if (progress <= 0) continue;

    const shimmer = 0.68 + 0.32 *
      Math.sin(now * 0.002 + p.phase);

    ctx.save();
    ctx.globalAlpha = progress * shimmer;
    ctx.font = `${p.size}px Georgia, serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    if (p.stem || p.leaf) {
      ctx.fillStyle = `hsl(${p.hue}, 65%, 64%)`;
      ctx.shadowColor = "#55ff9a";
      ctx.shadowBlur = 5;
    } else {
      ctx.fillStyle =
        `hsl(${p.hue}, 95%, ${65 + shimmer * 12}%)`;
      ctx.shadowColor = "#ff3c99";
      ctx.shadowBlur = 5;
    }

    const floatY = Math.sin(
      now * 0.0012 + p.phase
    ) * (p.stem ? 0.5 : 1.2);

    ctx.fillText(p.word, p.x, p.y + floatY);
    ctx.restore();
  }

  // Tiny decorative sparkles.
  for (let i = 0; i < 12; i++) {
    const angle = i * 2.4;
    const radius = scale * (0.35 + (i % 3) * 0.08);
    const x = cx + Math.cos(angle + now * 0.00015) * radius;
    const y = cy + Math.sin(angle + now * 0.00015) * radius;

    ctx.globalAlpha = 0.25 + 0.5 *
      (0.5 + 0.5 * Math.sin(now * 0.003 + i));

    ctx.fillStyle = "#ffd2e6";
    ctx.beginPath();
    ctx.arc(x, y, 1.3, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;
  frameId = requestAnimationFrame(draw);
}

function restart() {
  cancelAnimationFrame(frameId);
  createRose();
  startTime = performance.now();
  frameId = requestAnimationFrame(draw);
}

replay.addEventListener("click", restart);

window.addEventListener("resize", resize);

resize();
frameId = requestAnimationFrame(draw);
</script>
</body>
</html>
